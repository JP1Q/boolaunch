plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jp1q.boolaunch'
    compileSdk 34

    defaultConfig {
        applicationId "com.jp1q.boolaunch"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin']
        }
        test {
            java.srcDirs = ['src/test/kotlin']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Convenience task for IDE "one click" runs.
// Installs the debug APK and then launches the main activity on the connected device/emulator.
tasks.register('installAndLaunchDebug') {
    group = 'install'
    description = 'Installs the debug APK and launches MainActivity on a connected device/emulator.'
    dependsOn 'installDebug'

    doLast {
        def sdkPath = null

        // Prefer local.properties (standard Android convention)
        def localPropsFile = rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            def props = new Properties()
            localPropsFile.withInputStream { props.load(it) }
            sdkPath = props.getProperty('sdk.dir')
        }

        // Fall back to environment variables
        if (!sdkPath) sdkPath = System.getenv('ANDROID_SDK_ROOT')
        if (!sdkPath) sdkPath = System.getenv('ANDROID_HOME')

        if (!sdkPath) {
            throw new RuntimeException("Android SDK not found. Set sdk.dir in local.properties or ANDROID_SDK_ROOT/ANDROID_HOME.")
        }

        def isWindows = System.getProperty('os.name')?.toLowerCase()?.contains('windows')
        def adbExe = new File(new File(sdkPath.toString()), 'platform-tools/' + (isWindows ? 'adb.exe' : 'adb'))
        if (!adbExe.exists()) {
            throw new RuntimeException("adb not found at: ${adbExe}. Install Android SDK Platform-Tools.")
        }

        def appId = android.defaultConfig.applicationId

        // Pick the first online device/emulator to avoid "more than one device/emulator".
        def devicesOut = new ByteArrayOutputStream()
        exec {
            commandLine adbExe.absolutePath, 'devices'
            standardOutput = devicesOut
        }
        def serial = devicesOut
                .toString('UTF-8')
                .readLines()
                .find { it ==~ /^\S+\s+device\s*$/ }
                ?.tokenize()
                ?.first()

        if (!serial) {
            throw new RuntimeException('No online adb devices found. Start an emulator or connect a phone with USB debugging enabled.')
        }

        exec {
            commandLine adbExe.absolutePath, '-s', serial, 'shell', 'am', 'start', '-n', "${appId}/.MainActivity"
        }
    }
}

